{% extends "base.html" %}

{% block title %}
Edit User
{% endblock %}

{% block content %}

<div class="container">

    <h1>Edit User</h1>

    <form method="POST" action="{{ url_for('web.edit_user', user_id=user.id) }}">

        <div>

            <label for="name"> Name </label>

            <input id="name" type="text" name="name" value="{{ user.name }}" required>

        </div>

        <br>

        <div>

            <label for="email"> Email </label>

            <input id="email" type="email" name="email" value="{{ user.email }}" required>

        </div>

        <br>

        <button type="submit">
            Update User
        </button>

        <a href="{{ url_for('web.users') }}" class="button">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
