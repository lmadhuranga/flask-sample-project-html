{% extends "base.html" %}

{% block title %}
Users
{% endblock %}

{% block content %}

<div class="container">

    <div class="header">

        <h1>Users</h1>

        <a
            href="{{ url_for('web.create_user') }}"
            class="button"
        >
            Add User
        </a>

    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for user in users %}

            <tr>

                <td>{{ user.id }}</td>

                <td>{{ user.name }}</td>

                <td>{{ user.email }}</td>

                <td>

                    <a
                        href="{{ url_for('web.edit_user', user_id=user.id) }}"
                        class="button"
                    >
                        Edit
                    </a>

                    <form
                        action="{{ url_for('web.delete_user', user_id=user.id) }}"
                        method="POST"
                        style="display:inline;"
                    >

                        <button
                            type="submit"
                            onclick="return confirm('Are you sure you want to delete this user?');"
                        >
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            {% else %}

            <tr>
                <td colspan="4">
                    No users found.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
